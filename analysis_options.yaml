include: package:flutter_lints/flutter.yaml

# Single source of truth for `dart format`. The formatter reads this block
# (page_width + trailing_commas) from analysis_options.yaml — there is no
# separate dart-format.yaml. Keep this in sync with `.vscode/settings.json`.
formatter:
  page_width: 180
  trailing_commas: automate

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - noetec-ai-*/**

linter:
  rules:
    - always_declare_return_types
    - avoid_catching_errors
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
