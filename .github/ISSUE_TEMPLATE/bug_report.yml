name: Bug report
description: Report a bug or unexpected behavior in Noetec
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Noetec! Please check that the issue hasn't
        already been reported before submitting.

        Noetec is in **pre-alpha** — APIs and file formats may still change, and
        some features are incomplete. Bug reports are still very welcome.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: e.g. "The editor crashes when I paste a code block."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the problem.
      placeholder: |
        1. Open a vault …
        2. Create a new page …
        3. Paste a code block …
        4. The app crashes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include any error messages you saw.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Where did the bug happen?
      options:
        - Linux
        - macOS
        - Windows
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: input
    id: flutter-version
    attributes:
      label: Flutter / Dart version
      description: Paste the output of `flutter --version`.
      placeholder: e.g. "Flutter 3.35.0 • Dart 3.10.7"
  - type: input
    id: app-version
    attributes:
      label: Noetec version or commit
      description: The release/version or git commit you were running, if known.
      placeholder: e.g. "commit 3dd9002"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — logs, screenshots, sample notes, or a minimal reproduction.
